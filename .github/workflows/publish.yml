name: publish

# Tag-driven crates.io publish (seeds-e160): pushing a v* tag whose
# version matches the workspace Cargo.toml publishes the `seeds` crate.
# Strict tag == crate version discipline is d54c; the guard below
# refuses drifted tags before cargo sees them.
on:
  push:
    tags: ["v*"]

jobs:
  crates-io:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-22
      - name: Tag matches workspace version (strict)
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          if [ "$tag_version" != "$cargo_version" ]; then
            echo "FAIL: tag v$tag_version != Cargo.toml $cargo_version (d54c: tag == crate version, strictly)"
            exit 1
          fi
      - run: cargo publish --locked --token "${CARGO_REGISTRY_TOKEN}"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
