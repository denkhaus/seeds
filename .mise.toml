# Local development toolset, managed by mise (mirrors the toolchain image
# .fabro/Dockerfile.toolchain). The Rust toolchain is owned by rustup
# (pinned nightly-2026-09-22, see AGENTS.md). The tracker is this repo's
# own `seeds` binary (self-hosting cutover, seeds-3791): install it with
# `cargo install --path crates/seeds` — rustup's cargo bin dir is already
# on PATH, so no mise entry is needed.

[tools]
just = "1.58.0"
bun = "1.4.0"
"aqua:nushell/nushell" = "0.115.0"
"aqua:BurntSushi/ripgrep" = "15.2.0"
# Bootstrap phase remainder (ADR-0023): the jayminwest mulch CLI, the
# read+write compatible expertise target, until the mulch phase replaces
# it. The seeds CLI (@os-eco/seeds-cli) was dropped at the
# self-hosting cutover (seeds-3791); the sd-0.5.15 compat reference for
# the round-trip suite lives in crates/seeds/tests/fixtures/sd-reference.
"npm:@os-eco/mulch-cli" = "0.10.7"

# GitButler CLI (but) — pinned via http backend (no registry entry: GitHub
# releases carry no assets; the artifact comes from releases.gitbutler.com,
# see app.gitbutler.com/releases/version/<v>). 0.22.3-3234 is the build the
# fabro GitButler experiment validated (2026-10-03). Same pin as the
# global ~/.config/mise/config.toml entry; the per-repo pin makes the
# dependency explicit for this checkout.
"http:but" = { version = "0.22.3-fork.7", url = "https://github.com/denkhaus/gitbutler/releases/download/v0.22.3-fork.7/but-0.22.3-fork.7-x86_64-unknown-linux-gnu.tar.gz" }

[settings.npm]
# Non-TTY installs abort on the default backend's interactive approval
# prompt; bun is the verified path for these script-less CLIs.
package_manager = "bun"
