# Local development toolset, managed by mise (mirrors the toolchain image
# .fabro/Dockerfile.toolchain). The Rust toolchain is owned by rustup
# (pinned nightly-2026-09-22, see AGENTS.md). The tracker is this repo's
# own `seeds` binary (self-hosting cutover, seeds-3791) and ships as a
# released binary through the `cargo:seeds` entry below: a fresh clone
# gets `seeds` with the toolset. Bump that pin with each release (tag ==
# version, strictly). Local dev builds run from target/debug — the mise
# shim precedes ~/.cargo/bin, so `cargo install --path` does not reach
# the PATH (same shadow pattern that removed the mulch global pin).

[tools]
just = "1.58.0"
bun = "1.4.0"
"aqua:nushell/nushell" = "0.115.0"
"aqua:BurntSushi/ripgrep" = "15.2.0"
"cargo:seeds" = "0.13.0"
# The mulch self-hosting cutover (native Rust rewrite of the jayminwest
# ml CLI): read+write drop-in compatible with @os-eco/mulch-cli 0.10.7,
# binary `mulch` replaces `ml`. Same cutover pattern as cargo:seeds
# (seeds-3791); bump with each mulch release (tag == version, strictly).
"cargo:mulch" = "0.1.0"

[settings.npm]
# Non-TTY installs abort on the default backend's interactive approval
# prompt; bun is the verified path for these script-less CLIs.
package_manager = "bun"
